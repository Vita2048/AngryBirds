<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Angry Birds Clone</title>
  <link rel="icon" type="image/svg+xml" href="Icon.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="editor.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Arial Rounded MT Bold', 'Impact', sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #000;
    }
  </style>
</head>

<body>
  <script>
    const Engine = Matter.Engine,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body,
      Events = Matter.Events;

    let engine;
    let world;

    let gameState = 'START';
    let currentLevel = 0;
    let score = 0;
    let levelStartScore = 0;
    let levels = [];

    let birds = [];
    let pigs = [];
    let blocks = [];
    let particles = [];
    let gameBackgroundImage;
    let butterflyImg;
    let sunImg;
    let chickenFlyingImg, chickenShotImg;
    let butterflies = [];
    let chickens = [];

    let slingBase;
    let dragBird = null;
    let activeBird = null;
    let isDragging = false;
    let launchFrame = 0;
    let maxDragDist = 100;

    let camX = 0;
    let targetCamX = 0;
    let scaleF = 1;
    let levelInstanceId = 0;
    let birdSpawnCount = 7;

    function preload() {
      gameBackgroundImage = loadImage('ABBackgroundWide.png');
      butterflyImg = loadImage('Butterfly.png');
      sunImg = loadImage('SunSingle.png');
      chickenFlyingImg = loadImage('ChickenFlyingL.png');
      chickenShotImg = loadImage('ChickenShotL.png');
    }

    function windowResized() {
      scaleF = min(windowWidth / 1280, windowHeight / 720);
      resizeCanvas(1280 * scaleF, 720 * scaleF);
    }

    function setup() {
      scaleF = min(windowWidth / 1280, windowHeight / 720);
      createCanvas(1280 * scaleF, 720 * scaleF);
      textFont('Arial Rounded MT Bold');

      engine = Engine.create({ positionIterations: 8, velocityIterations: 8 });
      world = engine.world;

      slingBase = { x: 250, y: 570 };

      setupCollisions();

      if (gameBackgroundImage) {
        gameBackgroundImage.resize(0, 720);
      }

      for (let i = 0; i < 3; i++) {
        butterflies.push(new Butterfly());
      }
      for (let i = 0; i < 3; i++) {
        chickens.push(new Chicken());
      }



      levels = [
        {
          birds: ['bird_s', 'bird_s', 'bird_m', 'bird_s', 'bird_m'],
          pigs: [{ x: 950, y: 660, r: 25 }],
          blocks: [
            { x: 900, y: 630, w: 20, h: 100, type: 'wood' },
            { x: 1000, y: 630, w: 20, h: 100, type: 'wood' },
            { x: 950, y: 570, w: 140, h: 20, type: 'wood' }
          ]
        },
        {
          birds: ['bird_m', 'bird_s', 'bird_l', 'bird_m'],
          pigs: [{ x: 900, y: 660, r: 25 }, { x: 1100, y: 660, r: 25 }],
          blocks: [
            { x: 850, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 950, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 900, y: 570, w: 140, h: 20, type: 'wood' },
            { x: 900, y: 540, w: 20, h: 40, type: 'glass' },
            { x: 1050, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1150, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1100, y: 570, w: 140, h: 20, type: 'wood' },
            { x: 1100, y: 540, w: 20, h: 40, type: 'glass' }
          ]
        },
        {
          birds: ['bird_m', 'bird_m', 'bird_l', 'bird_s', 'bird_s'],
          pigs: [
            { x: 950, y: 660, r: 25 },
            { x: 1050, y: 660, r: 25 },
            { x: 1000, y: 540, r: 25 }
          ],
          blocks: [
            { x: 900, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1000, y: 630, w: 20, h: 100, type: 'wood' },
            { x: 1100, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1000, y: 570, w: 240, h: 20, type: 'stone' },
            { x: 950, y: 510, w: 20, h: 100, type: 'glass' },
            { x: 1050, y: 510, w: 20, h: 100, type: 'glass' },
            { x: 1000, y: 450, w: 140, h: 20, type: 'wood' },
            { x: 1000, y: 420, w: 40, h: 40, type: 'wood' }
          ]
        },
        {
          birds: ['bird_s', 'bird_m', 'bird_l', 'bird_l'],
          pigs: [
            { x: 1000, y: 660, r: 25 },
            { x: 1000, y: 480, r: 25 },
            { x: 1000, y: 300, r: 25 }
          ],
          blocks: [
            { x: 950, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1050, y: 630, w: 20, h: 100, type: 'stone' },
            { x: 1000, y: 570, w: 150, h: 20, type: 'stone' },
            { x: 970, y: 510, w: 15, h: 100, type: 'wood' },
            { x: 1030, y: 510, w: 15, h: 100, type: 'wood' },
            { x: 1000, y: 450, w: 100, h: 20, type: 'wood' },
            { x: 985, y: 390, w: 10, h: 100, type: 'glass' },
            { x: 1015, y: 390, w: 10, h: 100, type: 'glass' },
            { x: 1000, y: 330, w: 60, h: 15, type: 'glass' }
          ]
        },
        {
          birds: ['bird_l', 'bird_m', 'bird_m', 'bird_s', 'bird_s'],
          pigs: [
            { x: 800, y: 660, r: 25 },
            { x: 1200, y: 660, r: 25 },
            { x: 1000, y: 450, r: 25 },
            { x: 1000, y: 150, r: 25 }
          ],
          blocks: [
            { x: 750, y: 630, w: 30, h: 100, type: 'stone' },
            { x: 850, y: 630, w: 30, h: 100, type: 'stone' },
            { x: 800, y: 570, w: 130, h: 30, type: 'stone' },
            { x: 1150, y: 630, w: 30, h: 100, type: 'stone' },
            { x: 1250, y: 630, w: 30, h: 100, type: 'stone' },
            { x: 1200, y: 570, w: 130, h: 30, type: 'stone' },
            { x: 800, y: 510, w: 20, h: 100, type: 'wood' },
            { x: 1200, y: 510, w: 20, h: 100, type: 'wood' },
            { x: 1000, y: 510, w: 400, h: 20, type: 'stone' },
            { x: 950, y: 450, w: 15, h: 100, type: 'glass' },
            { x: 1050, y: 450, w: 15, h: 100, type: 'glass' },
            { x: 1000, y: 390, w: 150, h: 15, type: 'wood' },
            { x: 980, y: 330, w: 10, h: 100, type: 'wood' },
            { x: 1020, y: 330, w: 10, h: 100, type: 'wood' },
            { x: 1000, y: 270, w: 80, h: 15, type: 'stone' },
            { x: 1000, y: 210, w: 20, h: 100, type: 'glass' }
          ]
        }];
      // Check for level parameter in URL
      let params = new URLSearchParams(window.location.search);
      let lvl = params.get('level');
      if (lvl) {
        let lIdx = parseInt(lvl) - 1;
        if (lIdx >= 0 && lIdx < levels.length) {
          gameState = 'PLAYING';        // Changed from 'START' to directly start
          loadLevel(lIdx);
          return; // Important: skip the normal start screen
        }
      }
    }

    function calcBlockHealth(type, w, h) {
      let baseHp = type === 'stone' ? 300 : (type === 'wood' ? 100 : 50);
      let minSide = max(10, min(w, h));
      let area = max(400, w * h);
      // Thickness matters most; area contributes but with diminishing returns.
      let thicknessScale = pow(minSide / 20, 0.9);
      let areaScale = pow(area / 1600, 0.35);
      let hp = round(baseHp * thicknessScale * areaScale);
      return constrain(hp, round(baseHp * 0.6), round(baseHp * 8));
    }

    function loadLevel(idx) {
      levelInstanceId++;
      currentLevel = idx;
      birdSpawnCount = 7;

      if (idx === 0 && gameState === 'START') {
        score = 0;
        levelStartScore = 0;
      } else if (gameState === 'WAITING_WIN' || gameState === 'WIN') {
        levelStartScore = score;
      } else {
        score = levelStartScore;
      }

      World.clear(world);
      Engine.clear(engine);
      blocks = [];
      pigs = [];
      birds = [];
      particles = [];

      let ground = Bodies.rectangle(1500, 700, 6000, 40, { isStatic: true, friction: 1.0 });
      let leftWall = Bodies.rectangle(-500, 360, 100, 2000, { isStatic: true });
      let rightWall = Bodies.rectangle(3500, 360, 100, 2000, { isStatic: true });
      World.add(world, [ground, leftWall, rightWall]);

      let levelData = levels[idx];

      for (let b of levelData.blocks) {
        let opts = { angle: b.angle || 0 };
        if (b.type === 'wood') opts = { ...opts, density: 0.002, friction: 0.8, restitution: 0.2 };
        if (b.type === 'stone') opts = { ...opts, density: 0.005, friction: 0.9, restitution: 0.1 };
        if (b.type === 'glass') opts = { ...opts, density: 0.001, friction: 0.5, restitution: 0.3 };

        let body = Bodies.rectangle(b.x, b.y, b.w, b.h, opts);
        let hp = calcBlockHealth(b.type, b.w, b.h);
        let block = { body: body, type: b.type, w: b.w, h: b.h, health: hp, maxHealth: hp };
        body.gameObject = block;
        blocks.push(block);
        World.add(world, body);
      }

      for (let p of levelData.pigs) {
        let body = Bodies.circle(p.x, p.y, p.r, { density: 0.002, friction: 0.8, restitution: 0.4 });
        let pig = { body: body, r: p.r, health: 100, maxHealth: 100, isPig: true };
        body.gameObject = pig;
        pigs.push(pig);
        World.add(world, body);
      }

      for (let i = 0; i < levelData.birds.length; i++) {
        let type = levelData.birds[i];
        let r = (type === 'bird_s') ? 16 : (type === 'bird_m' ? 22 : 30);
        let bird = { type: type, r: r, state: 'queue', abilityUsed: false, isBird: true };
        birds.push(bird);
      }

      gameState = 'PLAYING';
      camX = 0;
      isDragging = false;
      activeBird = null;
      dragBird = null;

      setTimeout(loadNextBird, 500);
    }

    function loadNextBird() {
      // Cleanup any birds near the slingshot that might be "stuck"
      for (let b of birds) {
        if (b.state === 'slingshot' || (b.state === 'flying' && dist(b.body.position.x, b.body.position.y, slingBase.x, slingBase.y) < 50)) {
          b.state = 'used';
          World.remove(world, b.body);
        }
      }

      let next = birds.find(b => b.state === 'queue');
      if (next) {
        next.state = 'slingshot';
        dragBird = next;
        let density = (next.type === 'bird_s') ? 0.005 : (next.type === 'bird_m' ? 0.008 : 0.015);
        let body = Bodies.circle(slingBase.x, slingBase.y, next.r, { density: density, friction: 0.8, restitution: 0.2 });
        body.gameObject = next;
        next.body = body;
        Body.setStatic(next.body, true);
        World.add(world, body);
      }
    }

    function setupCollisions() {
      Events.on(engine, 'collisionStart', function (event) {
        for (let pair of event.pairs) {
          let bodyA = pair.bodyA;
          let bodyB = pair.bodyB;

          let vx = bodyA.velocity.x - bodyB.velocity.x;
          let vy = bodyA.velocity.y - bodyB.velocity.y;
          let relV = Math.sqrt(vx * vx + vy * vy);

          let force = relV * 8;

          if (force > 20) {
            if (bodyA.gameObject && bodyA.gameObject.health !== undefined) {
              bodyA.gameObject.health -= force;
            }
            if (bodyB.gameObject && bodyB.gameObject.health !== undefined) {
              bodyB.gameObject.health -= force;
            }
          }

          if (force > 14) {
            let contact = pair.collision.supports && pair.collision.supports.length
              ? pair.collision.supports[0]
              : { x: (bodyA.position.x + bodyB.position.x) * 0.5, y: (bodyA.position.y + bodyB.position.y) * 0.5 };
            triggerImpact(bodyA.gameObject, bodyB.gameObject, contact.x, contact.y, force);
            triggerImpact(bodyB.gameObject, bodyA.gameObject, contact.x, contact.y, force);
          }
        }
      });
    }

    function checkWinLose() {
      if (gameState === 'PLAYING') {
        if (pigs.length === 0) {
          gameState = 'WAITING_WIN';
          let capturedId = levelInstanceId;
          setTimeout(() => {
            if (levelInstanceId !== capturedId) return;
            gameState = 'WIN';
            score += birds.filter(b => b.state === 'queue').length * 10000;
            createConfetti();
          }, 1500);
        } else if (birds.filter(b => b.state === 'queue' || b.state === 'slingshot' || b.state === 'flying').length === 0) {
          gameState = 'WAITING_LOSE';
          let capturedId = levelInstanceId;
          setTimeout(() => {
            if (levelInstanceId !== capturedId) return;
            if (pigs.length > 0) {
              gameState = 'LOSE';
            } else {
              gameState = 'WIN';
              score += birds.filter(b => b.state === 'queue').length * 10000;
              createConfetti();
            }
          }, 3000);
        }
      }
    }

    function checkBirdStop() {
      for (let b of birds) {
        if (b.state === 'flying') {
          let speed = b.body.speed;
          let angular = Math.abs(b.body.angularVelocity);
          let p = b.body.position;

          if ((speed < 0.4 && angular < 0.08 && frameCount - launchFrame > 150) ||
            p.x > 3500 || p.x < -500 || p.y > 1000) {

            b.state = 'used';
            World.remove(world, b.body);

            if (b === activeBird) {
              activeBird = null;
              setTimeout(() => {
                if (gameState === 'PLAYING' || gameState === 'WAITING_WIN' || gameState === 'WAITING_LOSE') {
                  loadNextBird();
                }
              }, 800);
            }
          }
        }
      }
    }

    function useAbility() {
      if (!activeBird || activeBird.abilityUsed || activeBird.state !== 'flying') return;
      activeBird.abilityUsed = true;

      let v = activeBird.body.velocity;
      let p = activeBird.body.position;

      if (activeBird.type === 'bird_l') {
        let mag = Math.sqrt(v.x * v.x + v.y * v.y);
        let boost = 25;
        if (mag > 0.1) {
          Body.setVelocity(activeBird.body, { x: (v.x / mag) * boost, y: (v.y / mag) * boost });
        }
        createParticles(p.x, p.y, [255, 200, 50], 25);
      }
      else if (activeBird.type === 'bird_m') {
        for (let dy of [-12, 12]) {
          let bBody = Bodies.circle(p.x, p.y + dy, 18, { density: 0.008, friction: 0.5, restitution: 0.2 });
          Body.setVelocity(bBody, { x: v.x * 1.1, y: v.y + dy / 2 });
          let bird = { body: bBody, type: 'bird_m', r: 18, state: 'flying', abilityUsed: true, isBird: true };
          bBody.gameObject = bird;
          birds.push(bird);
          World.add(world, bBody);
        }
        createParticles(p.x, p.y, [255, 255, 100], 20);
      }
    }

    function updateCamera() {
      if (gameState !== 'START') {
        let targetX = 0;
        if (activeBird && activeBird.state === 'flying') {
          targetX = activeBird.body.position.x - 1280 / 2;
        }
        targetX = constrain(targetX, 0, 1000);
        camX = lerp(camX, targetX, 0.1);
      }
    }

    function getScaledMouse() {
      return {
        x: mouseX / scaleF,
        y: mouseY / scaleF
      };
    }

    function triggerImpact(obj, other, x, y, force) {
      if (!obj) return;

      if (obj.isBird) {
        obj.squash = min(0.34, force / 180);
        obj.squashFrame = frameCount;
        createImpactBurst(x, y, force, obj.type);
      } else if (obj.type) {
        if (obj.lastChipFrame && frameCount - obj.lastChipFrame < 8) return;
        obj.lastChipFrame = frameCount;
        createMaterialChips(x, y, obj.type, force);
      }
    }

    function mousePressed() {
      let sm = getScaledMouse();
      let mx = sm.x + camX;
      let my = sm.y;

      if (gameState === 'EDITOR') { edMousePressed(mx, my); return; }

      if (gameState === 'START') {
        if (abs(sm.x - 640) < 100 && abs(sm.y - 350) < 40) {
          loadLevel(0);
        }
        if (abs(sm.x - 640) < 100 && abs(sm.y - 450) < 40) {
          if (typeof enterEditor === 'function') {
            enterEditor();
          }
        }
        return;
      }

      if (gameState === 'WIN' || gameState === 'LOSE') {
        if (abs(sm.x - 640) < 125 && abs(sm.y - 410) < 40) {
          if (gameState === 'WIN') {
            if (edCustomLevel) { gameState = 'START'; score = 0; levels.pop(); edCustomLevel = null; }
            else if (currentLevel < levels.length - 1) loadLevel(currentLevel + 1);
            else { gameState = 'START'; score = 0; }
          } else {
            if (edCustomLevel) loadLevel(levels.length - 1);
            else loadLevel(currentLevel);
          }
        }
        return;
      }

      if (gameState === 'PLAYING' || gameState === 'WAITING_WIN' || gameState === 'WAITING_LOSE') {
        if (sm.x > 1280 - 140 && sm.x < 1280 - 20 && sm.y > 20 && sm.y < 60) {
          loadLevel(currentLevel);
          return;
        }

        if (dragBird && dist(mx, my, dragBird.body.position.x, dragBird.body.position.y) < dragBird.r * 2.5) {
          isDragging = true;
        } else if (activeBird && activeBird.state === 'flying' && !activeBird.abilityUsed) {
          useAbility();
        }
      }
    }

    function mouseDragged() {
      if (gameState === 'EDITOR') { edMouseDragged(); return; }
      if (isDragging && dragBird) {
        let sm = getScaledMouse();
        let mx = sm.x + camX;
        let my = sm.y;

        let base = createVector(slingBase.x, slingBase.y);
        let m = createVector(mx, my);
        let d = p5.Vector.sub(m, base);
        if (d.mag() > maxDragDist) {
          d.setMag(maxDragDist);
        }
        let target = p5.Vector.add(base, d);
        Body.setPosition(dragBird.body, { x: target.x, y: target.y });
        Body.setVelocity(dragBird.body, { x: 0, y: 0 });
      }
    }

    function mouseReleased() {
      if (gameState === 'EDITOR') { edMouseReleased(); return; }
      if (isDragging && dragBird) {
        isDragging = false;
        let base = createVector(slingBase.x, slingBase.y);
        let pos = createVector(dragBird.body.position.x, dragBird.body.position.y);
        let d = p5.Vector.sub(base, pos);

        if (d.mag() > 20) {
          dragBird.state = 'flying';
          activeBird = dragBird;
          Body.setStatic(dragBird.body, false);
          dragBird = null;
          launchFrame = frameCount;

          // Store the player's pull strength + direction as "launch momentum"
          // (actual body.velocity stays tiny due to original 0.001 scaling)
          activeBird.launchPull = { x: d.x, y: d.y };
          activeBird.launchPower = d.mag();

          let launchForce = 0.001 * activeBird.body.mass;
          Body.applyForce(activeBird.body, activeBird.body.position, { x: d.x * launchForce, y: d.y * launchForce });
          Body.setAngularVelocity(activeBird.body, d.x > 0 ? 0.1 : -0.1);
        } else {
          Body.setPosition(dragBird.body, { x: base.x, y: base.y });
        }
      }
    }

    function mouseWheel(event) {
      if (gameState === 'EDITOR' && typeof edMouseWheel === 'function') {
        if (edMouseWheel(event.delta)) return false;
      }
    }

    function keyPressed() {
      if (gameState === 'EDITOR') { edKeyPressed(); return; }
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + random(-10, 10), y: y + random(-10, 10),
          vx: random(-4, 4), vy: random(-4, 4),
          life: 255, color: color, size: random(4, 12), isConfetti: false, isGlass: false, kind: 'spark'
        });
      }
    }

    function createImpactBurst(x, y, force, type) {
      let palette = type === 'bird_m'
        ? [[255, 232, 69], [255, 178, 38], [255, 248, 178]]
        : type === 'bird_l'
          ? [[170, 16, 16], [255, 120, 90], [90, 12, 12]]
          : [[255, 58, 58], [255, 172, 140], [255, 235, 210]];

      let count = floor(constrain(force / 5, 4, 18));
      for (let i = 0; i < count; i++) {
        let angle = random(TWO_PI);
        let speed = random(1.5, 6) + force * 0.025;
        particles.push({
          x: x + random(-5, 5), y: y + random(-5, 5),
          vx: cos(angle) * speed, vy: sin(angle) * speed - random(0, 2),
          life: random(90, 160),
          color: random(palette),
          size: random(5, 12),
          isConfetti: false,
          isGlass: false,
          kind: random() > 0.38 ? 'feather' : 'dust',
          rot: random(TWO_PI),
          rotV: random(-0.25, 0.25)
        });
      }
    }

    function createMaterialChips(x, y, type, force) {
      let palette = type === 'glass'
        ? [[190, 235, 255], [235, 255, 255], [130, 210, 255]]
        : type === 'stone'
          ? [[135, 137, 132], [190, 190, 178], [88, 91, 88]]
          : [[166, 102, 45], [219, 154, 76], [116, 62, 24]];
      let count = floor(constrain(force / 9, 3, 12));
      for (let i = 0; i < count; i++) {
        let angle = random(TWO_PI);
        let speed = random(1, 5) + force * 0.012;
        particles.push({
          x: x, y: y,
          vx: cos(angle) * speed, vy: sin(angle) * speed - random(0, 1.5),
          life: random(80, 160), color: random(palette), size: random(3, 9),
          isConfetti: false, isGlass: type === 'glass', kind: type === 'glass' ? 'glass' : 'chip',
          rot: random(TWO_PI), rotV: random(-0.2, 0.2),
          points: [
            { x: random(-5, 5), y: random(-5, 5) },
            { x: random(-5, 5), y: random(-5, 5) },
            { x: random(-5, 5), y: random(-5, 5) }
          ]
        });
      }
    }

    function createGlassShatter(x, y, count) {
      for (let i = 0; i < count; i++) {
        let angle = random(TWO_PI);
        let speed = random(2, 8);
        particles.push({
          x: x, y: y,
          vx: cos(angle) * speed, vy: sin(angle) * speed - 2,
          life: 255, color: [200, 240, 255, 200],
          size: random(5, 15),
          isConfetti: false,
          isGlass: true,
          rot: random(TWO_PI),
          rotV: random(-0.2, 0.2),
          points: [
            { x: random(-5, 5), y: random(-5, 5) },
            { x: random(-5, 5), y: random(-5, 5) },
            { x: random(-5, 5), y: random(-5, 5) }
          ]
        });
      }
    }

    function createConfetti() {
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: camX + 640 + random(-400, 400), y: random(-200, 0),
          vx: random(-3, 3), vy: random(2, 6),
          life: 400, color: [random(100, 255), random(100, 255), random(100, 255)],
          size: random(8, 16), isConfetti: true
        });
      }
    }

    function updateDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.isConfetti) {
          p.vy += 0.05;
          p.x += sin(frameCount * 0.1 + p.life) * 2;
          p.life -= 1.5;
        } else if (p.isGlass) {
          p.vy += 0.25;
          p.rot += p.rotV;
          p.life -= 3;
        } else {
          p.vy += 0.2;
          if (p.rot !== undefined) p.rot += p.rotV || 0;
          p.life -= 5;
        }

        noStroke();
        if (p.isGlass) {
          push();
          translate(p.x, p.y);
          rotate(p.rot);
          fill(200, 230, 255, min(p.life, 180));
          stroke(255, 255, 255, min(p.life, 200));
          strokeWeight(1);
          beginShape();
          for (let pt of p.points) vertex(pt.x, pt.y);
          endShape(CLOSE);
          pop();
        } else if (p.kind === 'feather') {
          push();
          translate(p.x, p.y);
          rotate(p.rot);
          noStroke();
          fill(p.color[0], p.color[1], p.color[2], min(p.life, 210));
          ellipse(0, 0, p.size * 1.6, p.size * 0.65);
          stroke(255, 255, 255, min(p.life, 120));
          strokeWeight(1);
          line(-p.size * 0.55, 0, p.size * 0.55, 0);
          pop();
        } else if (p.kind === 'chip') {
          push();
          translate(p.x, p.y);
          rotate(p.rot);
          fill(p.color[0], p.color[1], p.color[2], min(p.life, 220));
          noStroke();
          rectMode(CENTER);
          rect(0, 0, p.size * 1.3, p.size * 0.7, 1);
          pop();
        } else {
          fill(p.color[0], p.color[1], p.color[2], min(p.life, 255));
          if (p.isConfetti) {
            push();
            translate(p.x, p.y);
            rotate(frameCount * 0.1 + p.life);
            rect(0, 0, p.size, p.size);
            pop();
          } else {
            circle(p.x, p.y, p.size);
          }
        }

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawBirdBody(r, id, type) {
      push();
      let ctx = drawingContext;
      let color, bellyColor, eyeColor, beakColor;
      if (type === 'bird_s') {
        color = '#ff3b3b'; bellyColor = '#ffcfcf'; eyeColor = '#ffffff'; beakColor = '#ffcc00';
      } else if (type === 'bird_m') {
        color = '#ffe100'; bellyColor = '#fff5a1'; eyeColor = '#ffffff'; beakColor = '#ff9900';
      } else {
        color = '#a30000'; bellyColor = '#ff8c8c'; eyeColor = '#ffffff'; beakColor = '#ffcc00';
      }

      drawingContext.shadowBlur = 18;
      drawingContext.shadowColor = 'rgba(0,0,0,0.28)';
      noStroke(); fill(0, 42); ellipse(3, 5, r * 2.0, r * 1.75);
      drawingContext.shadowBlur = 0;

      // Body
      let bodyGrad = ctx.createRadialGradient(-r * 0.45, -r * 0.55, r * 0.15, 0, 0, r * 1.35);
      bodyGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
      bodyGrad.addColorStop(0.18, color);
      bodyGrad.addColorStop(1, type === 'bird_m' ? '#d59b00' : (type === 'bird_l' ? '#5d0000' : '#aa1515'));
      ctx.fillStyle = bodyGrad;
      stroke(40, 18, 12); strokeWeight(2.4);
      if (type === 'bird_m') {
        // Triangular for medium
        triangle(-r, r, r, r, 0, -r * 1.2);
        fill(bellyColor); noStroke();
        arc(0, r * 0.4, r * 1.5, r, 0, PI);
      } else {
        // Round for others
        ellipse(0, 0, r * 2);
        fill(bellyColor); noStroke();
        arc(0, r * 0.2, r * 1.8, r * 1.4, 0, PI);
      }

      noFill();
      stroke(255, 255, 255, 90);
      strokeWeight(max(1.5, r * 0.09));
      arc(-r * 0.18, -r * 0.2, r * 1.35, r * 1.35, PI * 1.1, PI * 1.65);

      noStroke();
      fill(type === 'bird_m' ? '#7a4d00' : '#581010');
      triangle(-r * 0.55, -r * 0.82, -r * 0.25, -r * 1.35, -r * 0.05, -r * 0.76);
      triangle(-r * 0.1, -r * 0.9, r * 0.15, -r * 1.42, r * 0.35, -r * 0.78);

      // Eyes
      fill(255); stroke(0); strokeWeight(1);
      if (type === 'bird_l') {
        // Angrier eyes for big bird
        ellipse(-r * 0.4, -r * 0.2, r * 0.7, r * 0.8);
        ellipse(r * 0.4, -r * 0.2, r * 0.7, r * 0.8);
      } else {
        ellipse(-r * 0.35, -r * 0.1, r * 0.6, r * 0.7);
        ellipse(r * 0.35, -r * 0.1, r * 0.6, r * 0.7);
      }

      fill(0); noStroke();
      ellipse(-r * 0.25, -r * 0.1, r * 0.2);
      ellipse(r * 0.25, -r * 0.1, r * 0.2);

      // Eyebrows
      stroke(0); strokeWeight(3);
      line(-r * 0.7, -r * 0.5, -r * 0.1, -r * 0.3);
      line(r * 0.7, -r * 0.5, r * 0.1, -r * 0.3);

      // Beak
      let beakGrad = ctx.createLinearGradient(0, -r * 0.1, r * 0.85, r * 0.35);
      beakGrad.addColorStop(0, '#fff176');
      beakGrad.addColorStop(1, beakColor);
      ctx.fillStyle = beakGrad; stroke(70, 35, 0); strokeWeight(1);
      triangle(0, -r * 0.05, r * 0.8, r * 0.15, 0, r * 0.35);
      line(0, r * 0.15, r * 0.6, r * 0.15);

      pop();
    }

    function drawBirdIcon(type, x, y, s) {
      push();
      translate(x, y);
      scale(s);
      let r = (type === 'bird_s') ? 16 : (type === 'bird_m' ? 22 : 30);
      drawBirdBody(r, 999, type);
      pop();
    }

    function drawBird(bird) {
      push();
      translate(bird.body.position.x, bird.body.position.y);
      rotate(bird.body.angle);
      if (bird.squash && bird.squashFrame !== undefined) {
        let age = frameCount - bird.squashFrame;
        let pulse = max(0, 1 - age / 16);
        let wobble = sin(age * 0.9) * pulse;
        let sx = 1 + bird.squash * (0.75 * pulse + 0.16 * wobble);
        let sy = max(0.68, 1 - bird.squash * (0.55 * pulse + 0.12 * wobble));
        scale(sx, sy);
        if (age > 18) bird.squash = 0;
      }
      drawBirdBody(bird.r, bird.body.id, bird.type);
      pop();
    }

    function drawPig(pig) {
      push();
      translate(pig.body.position.x, pig.body.position.y);
      rotate(pig.body.angle);

      drawingContext.shadowBlur = 15;
      drawingContext.shadowColor = 'rgba(255,255,255,0.2)';

      // Draw an elegant wine glass
      stroke(255, 255, 255, 180);
      strokeWeight(2);
      fill(200, 230, 255, 100);

      // Bowl
      arc(0, -5, pig.r * 1.5, pig.r * 1.8, 0, PI, OPEN);
      line(-pig.r * 0.75, -5, pig.r * 0.75, -5);

      // Stem
      line(0, pig.r * 0.4, 0, pig.r * 1.2);

      // Base
      line(-pig.r * 0.5, pig.r * 1.2, pig.r * 0.5, pig.r * 1.2);

      // Liquid reflection
      noStroke();
      fill(255, 255, 255, 80);
      ellipse(-pig.r * 0.3, -pig.r * 0.2, pig.r * 0.4, pig.r * 0.6);

      pop();
    }

    function drawBlock(block) {
      push();
      translate(block.body.position.x, block.body.position.y);
      rotate(block.body.angle);

      drawingContext.shadowBlur = 8;
      drawingContext.shadowColor = 'rgba(0,0,0,0.5)';

      let hpRatio = block.health / block.maxHealth;
      let w = block.w, h = block.h;
      rectMode(CENTER);

      if (block.type === 'wood') {
        fill(190, 130, 70); stroke(100, 50, 20); strokeWeight(2);
        rect(0, 0, w, h);

        noStroke(); fill(255, 255, 255, 40);
        rect(0, -h / 2 + 3, w - 2, 6);
        fill(0, 0, 0, 30);
        rect(0, h / 2 - 3, w - 2, 6);

        stroke(130, 70, 30); strokeWeight(1.5);
        noFill();
        for (let i = -w / 2 + 6; i < w / 2; i += 8) {
          beginShape();
          for (let y = -h / 2 + 2; y <= h / 2 - 2; y += 10) {
            vertex(i + sin(y * 0.1 + i) * 2, y);
          }
          endShape();
        }
        if (h > 40 && w > 10) {
          fill(140, 80, 40); stroke(100, 50, 20);
          ellipse(0, h / 4, min(w * 0.6, 12), min(h * 0.3, 16));
        }
      } else if (block.type === 'stone') {
        fill(150); stroke(80); strokeWeight(2);
        rect(0, 0, w, h);

        noStroke(); fill(200); rect(0, -h / 2 + 3, w - 2, 6);
        fill(100); rect(0, h / 2 - 3, w - 2, 6);
        fill(180); rect(-w / 2 + 3, 0, 6, h - 2);
        fill(90); rect(w / 2 - 3, 0, 6, h - 2);

        fill(110); noStroke();
        circle(-w / 4, -h / 4, min(w, h) * 0.25);
        circle(w / 4, h / 4, min(w, h) * 0.15);
        circle(w / 3, -h / 5, min(w, h) * 0.1);
      } else if (block.type === 'glass') {
        fill(180, 230, 255, 140); stroke(255, 255, 255, 220); strokeWeight(2);
        rect(0, 0, w, h);

        noStroke(); fill(255, 255, 255, 180);
        beginShape();
        vertex(-w / 2 + 2, -h / 2 + 2); vertex(w / 2 - 12, -h / 2 + 2); vertex(-w / 2 + 2, h / 2 - 12);
        endShape(CLOSE);

        fill(255, 255, 255, 100);
        beginShape();
        vertex(w / 2 - 6, h / 2 - 2); vertex(w / 2 - 2, h / 2 - 6); vertex(w / 2 - 2, h / 2 - 2);
        endShape(CLOSE);
      }

      if (hpRatio < 0.6) {
        stroke(0, 0, 0, 180); strokeWeight(2); noFill();
        beginShape();
        vertex(-w / 4, -h / 4); vertex(0, 0); vertex(w / 4, -h / 8); vertex(w / 3, h / 3);
        endShape();
        if (hpRatio < 0.3) {
          beginShape();
          vertex(w / 4, -h / 4); vertex(0, 0); vertex(-w / 3, h / 4);
          endShape();
        }
      }
      pop();
    }

    function drawSky() {
      if (!gameBackgroundImage || gameBackgroundImage.width <= 0) {
        background('#288de0');
        return;
      }

      // Performance Optimization: Disable shadowBlur for large background images
      drawingContext.shadowBlur = 0;

      const img = gameBackgroundImage;
      const drawH = 720;
      const drawW = img.width; // Already resized in setup

      // To keep targets fixed on the background, we move 1:1 with the world.
      let startX = floor(camX / drawW) * drawW - drawW;
      let endX = camX + 1280 + drawW;

      for (let x = startX; x < endX; x += drawW) {
        image(img, x, 0, drawW, drawH);
      }
    }

    function drawGround() {
      // Background is now handled in drawSky for both game and editor modes.
    }

    function drawSun() {
      if (!sunImg) return;
      push();
      // Positioned top-right relative to screen, compensating for camX translation
      translate(camX + 1150, 110);

      let pulse = sin(frameCount * 0.025);
      let scaleVal = map(pulse, -1, 1, 0.9, 1.1);

      // Rotation synchronized with growth
      let rotSpeed = map(pulse, -1, 1, 0.005, 0.015);
      this.sunRot = (this.sunRot || 0) + rotSpeed;
      rotate(this.sunRot);

      // Gradiental Glow
      let ctx = drawingContext;
      let glowSize = map(pulse, -1, 1, 110, 210); // Reduced by ~20%
      let grad = ctx.createRadialGradient(0, 0, 10, 0, 0, glowSize);
      grad.addColorStop(0, 'rgba(255, 255, 180, 0.95)');
      grad.addColorStop(0.4, 'rgba(255, 220, 0, 0.6)');
      grad.addColorStop(1, 'rgba(255, 150, 0, 0)');

      ctx.fillStyle = grad;
      noStroke();
      circle(0, 0, glowSize * 2.2);

      // Sun Image - Reduced base size from 160 to 128
      imageMode(CENTER);
      image(sunImg, 0, 0, 128 * scaleVal, 128 * scaleVal);
      pop();
    }

    function drawButton(txt, x, y, w, h, hover) {

      rectMode(CENTER); textAlign(CENTER, CENTER); textSize(24);
      drawingContext.shadowBlur = 10; drawingContext.shadowColor = 'rgba(0,0,0,0.5)';

      if (hover) fill(255, 200, 50); else fill(255, 150, 0);
      stroke(255); strokeWeight(3);
      rect(x, y, w, h, 20);

      noStroke(); fill(255); drawingContext.shadowBlur = 0;
      text(txt, x, y);
      pop();
    }

    class Butterfly {
      constructor() {
        this.respawn();
        this.x = random(0, 3000);
        this.frame = floor(random(15));
        this.frameTimer = 0;
      }

      respawn() {
        this.x = camX - 200;
        if (random() > 0.5) this.x = camX + 1280 + 200;
        this.y = random(288, 650);
        this.vx = random(0.5, 1.5) * (this.x < camX ? 1 : -1);
        this.vy = random(-0.5, 0.5);
        this.scale = 0.12;
        this.phase = random(TWO_PI);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy + sin(frameCount * 0.05 + this.phase) * 0.75;

        this.frameTimer += 1.5;
        if (this.frameTimer >= 4) {
          this.frame = (this.frame + 1) % 15;
          this.frameTimer = 0;
        }

        if (this.x < camX - 400 || this.x > camX + 1680 || this.y < 250 || this.y > 700) {
          this.respawn();
        }
      }

      display() {
        if (!butterflyImg) return;
        let fw = butterflyImg.width / 4;
        let fh = butterflyImg.height / 4;
        let row = floor(this.frame / 4);
        let col = this.frame % 4;

        push();
        translate(this.x, this.y);
        if (this.vx < 0) scale(-1, 1);
        image(butterflyImg, -fw * this.scale / 2, -fh * this.scale / 2, fw * this.scale, fh * this.scale, col * fw, row * fh, fw, fh);
        pop();
      }
    }

    class Chicken {
      constructor() {
        this.init();
        // Stagger initial positions for a natural look
        this.x = random(camX, camX + 1280);
      }

      init() {
        let fromLeft = random() > 0.5;
        this.x = fromLeft ? camX - 100 : camX + 1380;
        this.y = random(180, 540);
        this.state = 'FLYING';
        this.vx = random(1, 3) * (fromLeft ? 1 : -1);
        this.vy = random(-1, 1);
        this.targetY = random(180, 540);
        this.frame = 0;
        this.frameTimer = 0;
        this.shotFrame = 0;
        this.splashTimer = 0;
        this.scale = 0.5;
        this.directionChangeTimer = random(60, 180);
        this.hitBirdType = 'bird_s';
        this.hitBirdRadius = 16;
      }

      update() {
        if (this.state === 'FLYING') {
          this.x += this.vx;
          this.y += this.vy;

          // Randomly change direction/speed
          this.directionChangeTimer--;
          if (this.directionChangeTimer <= 0) {
            this.vx = random(1, 3) * (this.vx > 0 ? 1 : -1);
            if (random() > 0.8) this.vx *= -1; // Sometimes flip direction
            this.vy = random(-1, 1);
            this.targetY = random(180, 540);
            this.directionChangeTimer = random(60, 180);
          }

          // Keep within height bounds
          if (this.y < 180) this.vy = abs(this.vy);
          if (this.y > 540) this.vy = -abs(this.vy);

          // Animation
          this.frameTimer++;
          if (this.frameTimer >= 3) {
            this.frame = (this.frame + 1) % 13;
            this.frameTimer = 0;
          }

          // Respawn if off screen
          if (this.vx > 0 && this.x > camX + 1500) this.init();
          if (this.vx < 0 && this.x < camX - 500) this.init();

          // Check collision with birds
          for (let b of birds) {
            if (b.state === 'flying') {
              let d = dist(this.x, this.y, b.body.position.x, b.body.position.y);
              if (d < 40) {
                this.state = 'SHOT';
                this.shotFrame = 0;
                this.frameTimer = 0;
                // Much gentler, more realistic knock:
                // Use bird's *current* direction at impact + pull strength for force.
                // Keep most of the chicken's own velocity so it doesn't fly away unrealistically.
                const bv = b.body.velocity;
                const bSpeed = Math.hypot(bv.x, bv.y) || 0.1;
                const power = (b.launchPower || 50) / 100;
                const knock = 1.6 + power * 3.0;          // ~1.6 to ~5.2 px/frame max

                const dx = bv.x / bSpeed;
                const dy = bv.y / bSpeed;

                // Blend (don't overwrite) so chicken mostly keeps its own flight
                this.vx = this.vx * 0.15 + dx * knock;
                this.vy = this.vy * 0.55 + dy * knock * 0.5 - 2.6;
                score += 1000;

                this.hitBirdType = b.type;
                this.hitBirdRadius = b.r;

                if (b.isSpawnedBird) {
                  birdSpawnCount = 3;
                }

                // Bird disappears with splash
                createImpactBurst(b.body.position.x, b.body.position.y, 50, b.type);
                b.state = 'used';
                World.remove(world, b.body);
                if (b === activeBird) {
                  activeBird = null;
                  setTimeout(() => {
                    if (gameState === 'PLAYING' || gameState === 'WAITING_WIN' || gameState === 'WAITING_LOSE') {
                      loadNextBird();
                    }
                  }, 800);
                }

                break;
              }
            }
          }
        } else if (this.state === 'SHOT') {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.25; // Gravity

          // Shot animation (play once and stop at last frame)
          this.frameTimer++;
          if (this.frameTimer >= 4) {
            if (this.shotFrame < 7) {
              this.shotFrame++;
            }
            this.frameTimer = 0;
          }

          if (this.y >= 680) {
            this.y = 680;
            this.state = 'SPLASH';
            this.splashTimer = 30;
            createImpactBurst(this.x, this.y, 40, 'bird_s');
          }
        } else if (this.state === 'SPLASH') {
          this.splashTimer--;
          if (this.splashTimer <= 0) {
            // Spawn new birds in random directions from the ground
            for (let i = 0; i < birdSpawnCount; i++) {
              let angle = random(PI, TWO_PI); // Mostly upwards
              let speed = random(10, 20);
              let r = this.hitBirdRadius;
              let density = (this.hitBirdType === 'bird_s') ? 0.005 : (this.hitBirdType === 'bird_m' ? 0.008 : 0.015);

              let bBody = Bodies.circle(this.x, this.y - 20, r, { density: density, friction: 0.5, restitution: 0.2 });
              Body.setVelocity(bBody, { x: cos(angle) * speed, y: sin(angle) * speed });
              let newBird = { body: bBody, type: this.hitBirdType, r: r, state: 'flying', abilityUsed: true, isBird: true, isSpawnedBird: true };
              bBody.gameObject = newBird;
              birds.push(newBird);
              World.add(world, bBody);
            }
            this.init();
          }
        }
      }

      display() {
        push();
        translate(this.x, this.y);

        let img, fCount, curF;
        if (this.state === 'FLYING') {
          img = chickenFlyingImg;
          fCount = 13;
          curF = this.frame;
          if (this.vx > 0) scale(-1, 1);
        } else {
          img = chickenShotImg;
          fCount = 8;
          curF = this.shotFrame;
          if (this.vx > 0) scale(-1, 1);
        }

        if (img && img.width > 0) {
          // Assuming vertical spritesheet (1 column, fCount rows)
          let fw = img.width;
          let fh = img.height / fCount;

          if (this.state === 'SPLASH') {
            let s = map(this.splashTimer, 30, 0, 1, 2);
            let a = map(this.splashTimer, 30, 0, 255, 0);
            tint(255, a);
            scale(s, s * 0.5);
          }

          imageMode(CENTER);
          // image(img, dx, dy, dWidth, dHeight, sx, sy, sWidth, sHeight)
          image(img, 0, 0, fw * this.scale, fh * this.scale, 0, curF * fh, fw, fh);
        }
        pop();
      }
    }

    function draw() {
      scale(scaleF);

      if (gameState === 'EDITOR') {
        drawSky();
        for (let bf of butterflies) { bf.update(); bf.display(); }
        drawEdCanvas();
        drawEdToolbar();
        drawEditorUI();
        drawEdBirdPanel();
        return;
      }

      if (gameState !== 'START') {
        Engine.update(engine, 1000 / 60);
        updateCamera();
        checkWinLose();
        checkBirdStop();

        for (let i = blocks.length - 1; i >= 0; i--) {
          let p = blocks[i].body.position;
          if (blocks[i].health <= 0 || p.y > 1000) {
            if (blocks[i].health <= 0) {
              createMaterialChips(p.x, p.y, blocks[i].type, 22);
              score += 500;
            }
            World.remove(world, blocks[i].body);
            blocks.splice(i, 1);
          }
        }
        for (let i = pigs.length - 1; i >= 0; i--) {
          let p = pigs[i].body.position;
          if (pigs[i].health <= 0 || p.y > 1000) {
            if (pigs[i].health <= 0) {
              createGlassShatter(p.x, p.y, 20);
              score += 5000;
            }
            World.remove(world, pigs[i].body);
            pigs.splice(i, 1);
          }
        }
      }

      push();
      translate(-camX, 0);

      drawSky();
      drawSun();
      for (let bf of butterflies) { bf.update(); bf.display(); }
      for (let c of chickens) { c.update(); c.display(); }
      drawGround();

      if (gameState !== 'START') {
        for (let b of blocks) drawBlock(b);
        for (let p of pigs) drawPig(p);

        stroke(70, 35, 15); strokeWeight(14); strokeCap(ROUND);
        line(slingBase.x - 15, slingBase.y - 10, slingBase.x, slingBase.y + 60);

        if (isDragging && dragBird) {
          stroke(40, 10, 10); strokeWeight(6);
          line(slingBase.x - 20, slingBase.y - 10, dragBird.body.position.x, dragBird.body.position.y);
        }

        for (let b of birds) {
          if (b.state !== 'used' && b.state !== 'queue') drawBird(b);
        }

        if (isDragging && dragBird) {
          fill(100, 50, 20); noStroke();
          push();
          translate(dragBird.body.position.x, dragBird.body.position.y);
          let angle = atan2(slingBase.y - dragBird.body.position.y, slingBase.x - dragBird.body.position.x);
          rotate(angle);
          rectMode(CENTER);
          rect(-dragBird.r, 0, 10, 28, 5);
          pop();

          stroke(40, 10, 10); strokeWeight(6);
          line(dragBird.body.position.x, dragBird.body.position.y, slingBase.x + 15, slingBase.y - 5);
        }

        stroke(80, 40, 20); strokeWeight(16); strokeCap(ROUND);
        line(slingBase.x, slingBase.y + 50, slingBase.x, 680);
        line(slingBase.x + 10, slingBase.y - 5, slingBase.x, slingBase.y + 55);

        stroke(200, 180, 140); strokeWeight(3);
        line(slingBase.x - 5, slingBase.y + 40, slingBase.x + 5, slingBase.y + 40);
        line(slingBase.x - 5, slingBase.y + 45, slingBase.x + 5, slingBase.y + 45);
        line(slingBase.x - 5, slingBase.y + 50, slingBase.x + 5, slingBase.y + 50);

        updateDrawParticles();
      }

      pop();
      drawUI();
    }
  </script>
</body>
